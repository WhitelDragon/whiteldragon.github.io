# Персоналии блога. Сортировка на странице personas.html — по убыванию mentions.
# Поля:
#   id          — уникальный slug (латиница, дефисы); он же адрес страницы /personas/<id>/
#   nick        — основной псевдоним / ник (как его пишет автор)
#   aliases     — список доп. ников (необязательно)
#   realname    — настоящее имя, если автор сам его называл (необязательно)
#   photo       — фото/аватар 400×400 из постов (assets/img/personas/<id>.jpg), необязательно
#   mentions    — число постов, где упоминается (= длина списка в persona_posts.yml)
#   period      — годы первого и последнего упоминания в блоге
#   summary     — одна строка: суть персонажа (служебное)
#   description — описание для карточки (40–80 слов), только то, что есть в постах
#   search      — регулярные выражения Python (с учётом регистра) для build_links.py:
#                 по ним ищутся посты. Если поля нет — ищется по nick/aliases/realname.
# mentions и period пересчитываются после build_links.py (см. _temp/personas/README.md).
# Сверено с постами 24.10.2026 — см. _temp/personas/REVIEW_PLAN.md.

